<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgba(0, 0, 255, 0.401);
            color: white;
            font: normal 20pt arial;
            
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>

    <script>
        var nome = window.prompt('Qual é seu nome?') // prompt serve para perguntar algo e voce dizer.
        window.alert('é um prazer em te conhecer, ' + nome + "!") // sinal de + é para concatenação 
    </script>

</body>
</html>
