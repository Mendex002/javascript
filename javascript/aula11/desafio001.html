<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade..</title>
</head>
<body>
    <h1>Estrangeiro ou Brasileiro?</h1>
    Digite seu país: <input type="text" name="txtpaís" id="txtpaís" placeholder="Ex: Brasil">
    <input type="button" value="Verificar" onclick="VerificarPaís()">
    <div id="país"></div>
    <script>
        function VerificarPaís(){
            var input = document.querySelector('input#txtpaís');
            var res = document.querySelector('div#país');
            var resposta = input.value.trim();

            

            if (resposta === ""){
                res.innerHTML = `<p><strong>Por favor, Digite o nome do seu país!!</strong></p>`
                return;
            }

            res.innerHTML = `<p>Você digitou <strong>${resposta}</strong></p>`

            var paisLower = resposta.toLowerCase();

            if (paisLower === "brasil") {
                res.innerHTML += `Você é Brasiliro!!`;

            }else {
                res.innerHTML += `Você é Estrangeiro!!`;
            }
        }
    </script>
</body>
</html>
